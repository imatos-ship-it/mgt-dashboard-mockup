function openEfficiency(){effView="counter";$("#efficiencyModal").classList.add("open");renderEfficiency()}
function renderEfficiency(){const a=avg(),projected=a*1.038,baseline=23.3,delta=(a-baseline).toFixed(1);$$("[data-eff-view]").forEach(b=>b.classList.toggle("active",b.dataset.effView===effView));if(effView==="counter"){$("#efficiencyBody").innerHTML=`<div class="eff-hero"><div class="national-number"><div class="eyebrow">Indicador nacional en vivo</div><strong id="nationalEff">${a.toFixed(2)}</strong><div class="gold">LITROS POR KWH</div><small>Movimiento operativo simulado en tiempo real</small></div><div class="card"><h3>Tendencia nacional · desempeño reciente</h3><canvas class="chart" id="nationalChart"></canvas><div class="chart-legend"><span><i style="background:var(--cyan)"></i>Desempeño en vivo</span><span><i style="background:var(--gold)"></i>Línea base</span><span><i style="background:var(--green)"></i>Proyección</span></div></div></div><div class="counter-grid">${kpi("Línea base nacional",baseline.toFixed(1),"antes de Madera Green Tech","var(--gold)")}${kpi("Diferencia vs. base","+"+delta,"litros adicionales por kWh","var(--green)")}${kpi("Mejora nacional","+23.9%","productividad energética","var(--green)")}${kpi("Proyección 90 días",projected.toFixed(1),"tendencia optimizada","var(--cyan)")}${kpi("Producción habilitada","+18.4M L","equivalente anualizado","var(--gold)")}${kpi("Ahorro incremental","$1.28M","equivalente anualizado","var(--green)")}${kpi("Mejor planta","Hermosillo","31.0 litros por kWh","var(--cyan)")}${kpi("Continuidad operativa","100%","6 de 6 plantas","var(--green)")}</div><div class="card table-wrap" style="margin-top:11px"><h3>Antes y después de Madera Green Tech · todas las plantas</h3><table class="table"><thead><tr><th>Ranking</th><th>Planta</th><th>Antes de MGT</th><th>En vivo</th><th>Proyección 90 días</th><th>Mejora</th><th>Tendencia</th></tr></thead><tbody>${[...plants].sort((a,b)=>b.eff-a.eff).map((p,i)=>`<tr><td>#${i+1}</td><td>${p.name}</td><td>${(p.eff/(1+p.improve/100)).toFixed(1)}</td><td class="cyan" data-live-plant="${plants.indexOf(p)}">${p.eff.toFixed(2)}</td><td class="gold">${(p.eff*1.038).toFixed(1)}</td><td class="green">+${p.improve}%</td><td class="green">↗ Mejora sostenida</td></tr>`).join("")}</tbody></table></div>`}else{$("#efficiencyBody").innerHTML=`<div class="market-layout"><div class="card"><div class="between"><div><div class="eyebrow">Índice de eficiencia productiva · actualización continua</div><h2 style="margin-top:5px">Mercado en vivo · Litros por kWh</h2></div><div class="live"><i class="pulse"></i>DATOS EN VIVO</div></div><canvas class="chart market-chart" id="marketChart"></canvas><div class="market-note">Cada línea representa el desempeño productivo de una planta. La visualización se desplaza con nuevas lecturas simuladas, como un monitor de mercado.</div></div><div class="card"><h3>Cotización operativa por planta</h3><div class="ticker-list" id="tickerList"></div></div></div><div class="grid kpis-4" style="margin-top:11px">${kpi("Índice nacional",a.toFixed(2),"litros por kWh","var(--cyan)")}${kpi("Variación sesión","+0.42%","vs. apertura operativa","var(--green)")}${kpi("Líder nacional","Hermosillo","31.0 litros por kWh","var(--gold)")}${kpi("Plantas monitoreadas","6 / 6","actualización continua","var(--green)")}</div>`}drawCharts();drawMarket()}
function closeEfficiency(){$("#efficiencyModal").classList.remove("open")}$("#closeEfficiency").onclick=closeEfficiency;$("#openEfficiency").onclick=openEfficiency;$$("[data-eff-view]").forEach(b=>b.onclick=()=>{effView=b.dataset.effView;renderEfficiency()});
function line(id,series,colors){const c=$("#"+id);if(!c)return;const x=c.getContext("2d"),w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2,p=42,W=w-p-18,H=h-p-18,flat=series.flat(),hi=Math.max(...flat)*1.12,lo=Math.min(0,...flat);x.clearRect(0,0,w,h);x.strokeStyle="rgba(255,255,255,.07)";x.lineWidth=1;for(let i=0;i<5;i++){x.beginPath();x.moveTo(p,16+i*H/4);x.lineTo(w-12,16+i*H/4);x.stroke()}series.forEach((a,j)=>{x.strokeStyle=colors[j];x.lineWidth=4;x.beginPath();a.forEach((v,i)=>{const px=p+i*W/(a.length-1),py=16+H-(v-lo)/(hi-lo)*H;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}
function bars(id,data,colors){const c=$("#"+id);if(!c)return;const x=c.getContext("2d"),w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2,p=42,hi=Math.max(...data)*1.15,bw=(w-p-18)/data.length*.55;x.clearRect(0,0,w,h);data.forEach((v,i)=>{const px=p+(i+.22)*(w-p-18)/data.length,py=15+(h-p-15)*(1-v/hi);x.fillStyle=colors[i%colors.length];x.fillRect(px,py,bw,h-p-py)})}
function drawCharts(){bars("areaChart",[31.7,30.5,29.8,28.9,27.6],["#53cde4","#cfab4f"]);line("cashChart",[[4,9,15,22,31,42,55,69,85,103,123,145,168,193,219,246,274,303,334,366],[8,17,28,40,54,69,86,104,124,146,170,196,224,254,286,320,356,394,434,472]],["#cfab4f","#53cde4"]);const wave=(base,amp,n=24)=>Array.from({length:n},(_,i)=>base+Math.sin(i/2.8)*amp+(i%4)*amp*.08);line("loadChart",[wave(2800,520),wave(65,18)],["#42d98f","#a99be8"]);line("solarChart",[wave(1450,980),wave(1390,900)],["#f3c852","#a99be8"]);line("socChart",[wave(73,9)],["#53cde4"]);line("gridChart",[wave(20,10)],["#a99be8"]);bars("fuelChart",[110,82,125,66,91,74,88],["#ff9d65"]);line("qualityChart",[wave(99.2,.3),wave(98,.25)],["#42d98f","#53cde4"]);line("forecastChart",[wave(92,4),wave(91,3.3)],["#cfab4f","#53cde4"]);bars("eventsChart",[23,2,14],["#6aa7ff","#ffb44c","#42d98f"]);line("nationalChart",[marketSeries.map(s=>s[s.length-1]).map((_,i)=>avg()+Math.sin((i+tick)/4)*.08),Array(6).fill(23.3),Array(6).fill(avg()*1.038)],["#53cde4","#cfab4f","#42d98f"])}
function updateMarket(){marketSeries.forEach((series,i)=>{const previous=series[series.length-1],anchor=plants[i].eff,move=Math.sin((tick+i*1.7)/3.4)*.045+(Math.random()-.5)*.045+(anchor-previous)*.16;series.push(previous+move);if(series.length>42)series.shift()})}
function drawMarket(){const c=$("#marketChart");if(!c)return;const ctx=c.getContext("2d"),w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2,left=62,right=24,top=24,bottom=42,W=w-left-right,H=h-top-bottom,flat=marketSeries.flat(),lo=Math.floor((Math.min(...flat)-.4)*2)/2,hi=Math.ceil((Math.max(...flat)+.4)*2)/2;ctx.clearRect(0,0,w,h);ctx.font="18px Arial";for(let i=0;i<6;i++){const y=top+H*i/5,value=hi-(hi-lo)*i/5;ctx.strokeStyle="rgba(255,255,255,.075)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillStyle="#73838d";ctx.fillText(value.toFixed(1),8,y+6)}marketSeries.forEach((series,j)=>{ctx.strokeStyle=marketColors[j];ctx.lineWidth=4;ctx.beginPath();series.forEach((value,i)=>{const x=left+i*W/(series.length-1),y=top+(hi-value)/(hi-lo)*H;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();const last=series[series.length-1],x=w-right,y=top+(hi-last)/(hi-lo)*H;ctx.fillStyle=marketColors[j];ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill()});ctx.fillStyle="#73838d";["APERTURA","-20 MIN","-10 MIN","AHORA"].forEach((label,i)=>ctx.fillText(label,left+i*W/3-18,h-10));$("#tickerList").innerHTML=plants.map((p,i)=>{const current=marketSeries[i][marketSeries[i].length-1],opening=marketSeries[i][0],change=(current-opening)/opening*100;return `<div class="ticker"><div class="ticker-head"><span><i style="display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:${marketColors[i]}"></i>${p.name}</span><span class="${change>=0?"green":"amber"}">${change>=0?"+":""}${change.toFixed(2)}%</span></div><b style="color:${marketColors[i]}">${current.toFixed(2)}</b><small>L/kWh · línea base ${(p.eff/(1+p.improve/100)).toFixed(1)} · proyección ${(p.eff*1.038).toFixed(1)}</small></div>`}).join("")}
function render(){renderProduction();renderSimpleFlow();renderPerformance();renderOperations();renderDiagnostics();renderNational();renderFinance();renderEnterprise();bind();$$("[data-map]").forEach(d=>d.onclick=()=>{selected=plants[+d.dataset.map];render();show("production","plant")})}
function clock(){const d=new Date(),time=d.toLocaleTimeString("es-MX",{hour12:false});$("#clock").textContent=time;$("#date").textContent=d.toLocaleDateString("es-MX",{weekday:"long",day:"2-digit",month:"short",year:"numeric"});$("#updated").textContent="Última actualización: "+time}
function live(){tick++;updateMarket();const solar=Math.round(selected.solar+Math.sin(tick/3)*92),load=Math.round(selected.load+Math.sin(tick/4)*64),grid=selected.grid?Math.max(6,Math.round(selected.grid+Math.sin(tick/5)*8)):0;["dirSolar","opSolar"].forEach(id=>{if($("#"+id))$("#"+id).textContent=solar.toLocaleString()+" kW"});["dirLoad","opLoad","prodLoad"].forEach(id=>{if($("#"+id))$("#"+id).textContent=load.toLocaleString()+" kW"});["dirGrid","opGrid"].forEach(id=>{if($("#"+id))$("#"+id).textContent=grid+" kW"});if($("#nationalEff"))$("#nationalEff").textContent=(avg()+Math.sin(tick/5)*.08).toFixed(2);$$("[data-live-plant]").forEach(e=>{const s=marketSeries[+e.dataset.livePlant];e.textContent=s[s.length-1].toFixed(2)});drawMarket()}
function rotateBanner(){const b=banners[bannerIndex++%banners.length];$("#bannerTag").textContent=b[0];$("#bannerText").textContent=b[1];const p=$(".banner-progress i");p.style.animation="none";void p.offsetHeight;p.style.animation="progress 8s linear infinite"}
$$(".navbtn").forEach(b=>b.onclick=()=>show(nav[b.dataset.persona][0][0],b.dataset.persona));render();show("production","plant");clock();rotateBanner();live();setInterval(clock,1000);setInterval(live,1600);setInterval(rotateBanner,8000);window.addEventListener("resize",()=>setTimeout(drawCharts,80));document.addEventListener("keydown",e=>{if(e.key==="Escape")closeEfficiency()});
</script>
</body>
</html>
