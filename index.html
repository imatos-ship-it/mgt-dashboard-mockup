ckground:rgba(5,10,14,.82);color:var(--gold2);font-size:9px;font-weight:900;letter-spacing:.7px}.component-modal{position:fixed;z-index:80;inset:0;display:none;background:rgba(2,6,9,.72);backdrop-filter:blur(8px)}.component-modal.open{display:grid;place-items:center}.component-panel{width:min(980px,92vw);max-height:88vh;overflow:auto;border:1px solid var(--line2);border-radius:13px;background:radial-gradient(circle at 95% 0,rgba(83,205,228,.12),transparent 34%),var(--panel);box-shadow:0 28px 80px rgba(0,0,0,.55)}.component-head{display:flex;justify-content:space-between;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}.component-head h2{margin-top:5px}.component-body{padding:16px 18px}.component-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.control-btn{padding:10px;border:1px solid rgba(83,205,228,.24);border-radius:8px;background:rgba(83,205,228,.07);color:#d8faff;text-align:left;font-size:11px;font-weight:900}.control-btn small{display:block;margin-top:4px;color:var(--muted);font-weight:700;line-height:1.35}.control-btn.warn{border-color:rgba(255,180,76,.35);background:rgba(255,180,76,.08);color:#ffd9a2}.audit-row{padding:8px 0;border-bottom:1px solid var(--line);color:var(--soft);font-size:11px}.audit-row time{display:inline-block;width:64px;color:var(--cyan);font-family:var(--mono)}@media(max-width:1150px){.director-flow{grid-template-columns:1fr}.forecast-week{grid-template-columns:repeat(2,1fr)}.component-grid,.control-grid{grid-template-columns:1fr}}
.map-site-card{position:absolute;left:18px;top:-16px;width:220px;padding:10px;border:1px solid var(--line2);border-radius:9px;background:rgba(5,10,14,.96);box-shadow:0 18px 38px rgba(0,0,0,.42);color:var(--soft);font-size:10px;text-align:left;line-height:1.35;opacity:0;transform:translateY(4px);pointer-events:none;transition:.16s;backdrop-filter:blur(8px)}.map-site-card b{display:block;color:var(--gold2);font-size:12px;margin-bottom:5px}.map-site-card span{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--line);padding-top:5px;margin-top:5px}.map-site-card strong{color:var(--text);font-family:var(--mono);font-size:10px}.map-pin:hover{z-index:10}.map-pin:hover .map-site-card{opacity:1;transform:translateY(0)}

<body>

 <header class="header">

 <main>
  <section id="production" class="view active"></section><section id="simple-flow" class="view"></section><section id="performance" class="view"></section>
  <section id="operations" class="view"></section><section id="diagnostics" class="view"></section>
  <section id="national" class="view corp"></section><section id="finance" class="view corp"></section><section id="enterprise" class="view corp"></section>
 </main>
 <footer class="footer"><span id="updated">Última actualización: --:--:--</span><span>Datos simulados para demostración ejecutiva</span></footer>
</div>
<div class="modal" id="efficiencyModal">
 <div class="modal-head"><div><div class="eyebrow">Experiencia insignia Madera Green Tech</div><h2>Centro Nacional de Eficiencia Productiva</h2></div><div class="modal-actions"><div class="eff-tabs"><button class="eff-tab active" data-eff-view="counter">Contador ejecutivo</button><button class="eff-tab" data-eff-view="market">Monitor de desempeño</button></div><button class="close" id="closeEfficiency">Cerrar experiencia</button></div></div>
 <div class="modal-body" id="efficiencyBody"></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const plants=[
 {name:"Hermosillo",state:"Sonora",eff:31.0,improve:30,status:"optimal",statusText:"Operación óptima",message:"Modo aislado. ATS abierto. Sistema MGT alimentando planta. Red CFE disponible, no utilizada.",grid:0,solar:2340,soc:74,load:2130,saving:4631,co2:3460,capex:10.6,roi:397,payback:4.5},
 {name:"La Paz",state:"Baja California Sur",eff:30.2,improve:27,status:"normal",statusText:"Operación normal",message:"Producción solar superior al pronóstico.",grid:9,solar:1980,soc:78,load:1890,saving:3820,co2:2860,capex:8.7,roi:372,payback:4.7},
 {name:"Guadalajara",state:"Jalisco",eff:28.7,improve:20,status:"attention",statusText:"Atención menor",message:"Mantenimiento preventivo PCS programado. Sin impacto operativo.",grid:32,solar:2620,soc:69,load:2490,saving:4250,co2:3290,capex:11.4,roi:349,payback:4.9},
 {name:"Zapopan",state:"Jalisco",eff:29.4,improve:23,status:"optimize",statusText:"Optimización activa",message:"EMS optimizando despacho energético.",grid:18,solar:2160,soc:72,load:2080,saving:3990,co2:3010,capex:9.8,roi:365,payback:4.8},
 {name:"Aguascalientes",state:"Aguascalientes",eff:27.8,improve:18,status:"attention",statusText:"Atención menor",message:"Generador redundante N+1 requiere revisión. Sin impacto operativo.",grid:27,solar:2050,soc:71,load:2010,saving:3760,co2:2940,capex:9.2,roi:338,payback:5.0},
 {name:"San Luis Potosí",state:"San Luis Potosí",eff:26.5,improve:15,status:"optimize",statusText:"Optimización activa",message:"Reducción de picos de demanda en ejecución.",grid:21,solar:1910,soc:75,load:1840,saving:3540,co2:2730,capex:8.9,roi:326,payback:5.1}
];
const nav={plant:[["production","Centro de Producción"],["simple-flow","Flujo Energético"],["performance","Rendimiento y Análisis"]],ops:[["operations","Flujo Energético"],["diagnostics","Tendencias y Diagnósticos"]],corp:[["national","Red Nacional"],["finance","Finanzas y ESG"],["enterprise","Valor Empresarial"]]};
const banners=[["ATENCIÓN MENOR","Guadalajara: mantenimiento PCS programado. Sin impacto operativo."],["OPTIMIZACIÓN ACTIVA","Zapopan: EMS optimizando demanda máxima."],["PRONÓSTICO","Sonora: irradiación superior al pronóstico."],["TARIFA CFE","Ajuste tarifario estimado CFE +3.1%."],["VALOR GENERADO","Ahorros acumulados superiores al objetivo."],["IMPACTO ESG","Reducción de emisiones superior al plan."],["INTELIGENCIA MGT","La analítica identificó una nueva oportunidad de optimización."],["CONTINUIDAD","100% continuidad operativa en el portafolio nacional."]];
let selected=plants[0],tick=0,range="day",customStart="2026-05-01",customEnd="2026-06-02",bannerIndex=0,effView="counter",corpScope="0",enterpriseScope="0",financeRange="20y",efficiencyScope="profile";
const directorPlantIds=[0,1,2,3],opsPlantId=0;
const marketColors=["#53cde4","#42d98f","#cfab4f","#6aa7ff","#ffb44c","#a99be8"];
const marketSeries=plants.map((p,i)=>Array.from({length:32},(_,n)=>p.eff+Math.sin((n+i*2)/5)*.16+Math.cos((n+i)/3)*.055));
const scopePlants=scope=>scope==="all"?plants:[plants[+scope]];
const aggregate=(scope="all")=>{const list=scopePlants(scope),n=list.length,sum=f=>list.reduce((a,p)=>a+f(p),0),avgv=f=>sum(f)/n;return {list,n,name:scope==="all"?"Flota nacional":list[0].name,eff:avgv(p=>p.eff),improve:avgv(p=>p.improve),capex:sum(p=>p.capex),saving:sum(p=>p.saving)*365/1000000,co2:sum(p=>p.co2),roi:avgv(p=>p.roi),payback:avgv(p=>p.payback),cash:sum(p=>p.saving)*365/1000000*37.2,ebitda:sum(p=>p.saving)*365/1000000*4.7,protected:sum(p=>p.saving)*365/1000000*46.9}};
const currentAccess=()=>{const corpActiveScope=activeView()==="enterprise"?enterpriseScope:corpScope;return activePersona()==="corp"?{label:corpActiveScope==="all"?"Flota nacional":plants[+corpActiveScope].name,list:scopePlants(corpActiveScope),scope:corpActiveScope}:activePersona()==="ops"?{label:plants[opsPlantId].name,list:[plants[opsPlantId]],scope:String(opsPlantId)}:{label:selected.name,list:[selected],scope:String(plants.indexOf(selected))}};
const options=()=>{const persona=activePersona(),ids=persona==="plant"?directorPlantIds:persona==="ops"?[opsPlantId]:plants.map((_,i)=>i);return ids.map(i=>`<option value="${i}" ${plants[i]===selected?"selected":""}>${plants[i].name} · ${plants[i].state}</option>`).join("")};
const corporateOptions=scope=>`<option value="all" ${scope==="all"?"selected":""}>Todas las plantas · Flota nacional</option>`+plants.map((p,i)=>`<option value="${i}" ${scope===String(i)?"selected":""}>${p.name} · ${p.state}</option>`).join("");
const title=(eyebrow,name,sub,selector=false)=>`<div class="titlebar"><div><div class="eyebrow">${eyebrow}</div><h1>${name}</h1><p>${sub}</p></div>${selector?`<div class="selectors"><label>Planta seleccionada</label><select class="select plant-select">${options()}</select></div>`:""}</div>`;
const kpi=(label,value,sub,color="var(--gold)",hero=false,id="")=>`<div class="kpi ${hero?"hero-kpi":""}" ${hero?'data-open-efficiency="true"':""} style="--kc:${color}"><div class="label">${label}</div><strong ${id?`id="${id}"`:""}>${value}</strong><small>${sub}</small></div>`;
const status=()=>`<span class="status ${selected.status}">${selected.statusText}</span>`;
const banner=()=>`<div class="plant-banner"><div class="plant-head"><div><h2>${selected.name}</h2><p>${selected.message}</p></div></div>${status()}</div>`;
const bind=()=>{$$(".plant-select").forEach(s=>{s.innerHTML=options();s.value=plants.indexOf(selected);s.onchange=e=>{selected=plants[+e.target.value];render();show(activeView(),activePersona())}});$$(".corp-scope").forEach(s=>{s.innerHTML=corporateOptions(s.dataset.target==="enterprise"?enterpriseScope:corpScope);s.onchange=e=>{if(s.dataset.target==="enterprise")enterpriseScope=e.target.value;else corpScope=e.target.value;render();show(activeView(),"corp")}});$$(".finance-range").forEach(s=>{s.value=financeRange;s.onchange=e=>{financeRange=e.target.value;renderFinance();bind();drawCharts()}});$$('[data-open-efficiency]').forEach(b=>b.onclick=openEfficiency)};
const avg=()=>plants.reduce((a,p)=>a+p.eff,0)/plants.length;
function activeView(){return $(".view.active")?.id||"production"}function activePersona(){return $(".navbtn.active")?.dataset.persona||"plant"}
function renderSubnav(persona,active){$("#subnav").innerHTML=nav[persona].map(([id,label])=>`<button class="subbtn ${id===active?"active":""}" data-view="${id}">${label}</button>`).join("");$$(".subbtn").forEach(b=>b.onclick=()=>show(b.dataset.view,persona))}
function show(id,persona){if(persona==="ops")selected=plants[opsPlantId];if(persona==="plant"&&!directorPlantIds.includes(plants.indexOf(selected)))selected=plants[directorPlantIds[0]];$$(".view").forEach(v=>v.classList.toggle("active",v.id===id));$$(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.persona===persona));renderSubnav(persona,id);render();renderSubnav(persona,id);$$(".view").forEach(v=>v.classList.toggle("active",v.id===id));setTimeout(()=>{drawCharts();drawMarket()},40)}
function simpleSvg(full=false){return `<div class="${full?"scada-topology":"simple-flow"}"><div class="topology-title"><h3>${full?"Entorno operativo en tiempo real":"Flujo simplificado para dirección de planta"}</h3><span class="mode">${selected.name==="Hermosillo"?"MODO AISLADO · ATS ABIERTO":"OPTIMIZACIÓN ACTIVA · CONTINUIDAD PLENA"}</span></div><svg viewBox="0 0 900 540">
 <path class="flow solar" d="M190 150 C290 150 292 245 390 245"/><path class="flow bess" d="M190 395 C290 395 292 315 390 315"/><path class="flow gas" d="M710 150 C610 150 608 245 510 245"/><path class="flow gridline" ${selected.grid===0?'style="opacity:.2"':""} d="M710 395 C610 395 608 315 510 315"/><path class="flow load" d="M450 355 L450 450"/>
 <rect class="node" x="45" y="100" rx="14" width="145" height="100"/><rect class="node" x="45" y="345" rx="14" width="145" height="100"/><rect class="node" x="710" y="100" rx="14" width="145" height="100"/><rect class="node" x="710" y="345" rx="14" width="145" height="100"/><rect class="bus" x="390" y="225" rx="17" width="120" height="120"/><rect class="node" x="370" y="450" rx="14" width="160" height="75"/>
 <text class="svg-title" x="118" y="136" text-anchor="middle">SOLAR</text><text class="svg-val" id="${full?"opSolar":"dirSolar"}" fill="#f3c852" x="118" y="168" text-anchor="middle">${selected.solar.toLocaleString()} kW</text>
 <text class="svg-title" x="118" y="382" text-anchor="middle">BESS</text><text class="svg-val" fill="#53cde4" x="118" y="414" text-anchor="middle">-420 kW</text>
 <text class="svg-title" x="783" y="136" text-anchor="middle">GENERADOR</text><text class="svg-val" fill="#ff9d65" x="783" y="168" text-anchor="middle">0 kW</text>
 <text class="svg-title" x="783" y="382" text-anchor="middle">RED CFE</text><text class="svg-val" id="${full?"opGrid":"dirGrid"}" fill="#a99be8" x="783" y="414" text-anchor="middle">${selected.grid} kW</text>
 <text class="svg-title" x="450" y="267" text-anchor="middle">BARRA PRINCIPAL</text><text class="svg-val" fill="#f3d986" x="450" y="301" text-anchor="middle">EMS MGT</text><text class="svg-sub" x="450" y="324" text-anchor="middle">DESPACHO ÓPTIMO</text>
 <text class="svg-title" x="450" y="482" text-anchor="middle">CARGAS</text><text class="svg-val" id="${full?"opLoad":"dirLoad"}" fill="#42d98f" x="450" y="511" text-anchor="middle">${selected.load.toLocaleString()} kW</text></svg></div>`}
function renderProduction(){$("#production").innerHTML=title("Director de Planta · Visibilidad inmediata","Centro de Producción","¿Cómo está operando mi planta ahora mismo?",true)+banner()+`<div class="grid kpis-9">${kpi("Demanda actual",selected.load.toLocaleString()+" kW","producción operando normalmente","var(--green)","", "prodLoad")}${kpi("Generación actual",(selected.solar+420).toLocaleString()+" kW","solar y respaldo inteligente","var(--solar)")}${kpi("Dependencia red CFE",selected.grid+" kW",selected.grid?"importación residual":"disponible · no utilizada","var(--grid)")}${kpi("Estado BESS",selected.soc+"%","descarga optimizada · disponible","var(--bess)")}${kpi("Estado generador","En espera","redundancia N+1 disponible","var(--gas)")}${kpi("Disponibilidad","100.00%","continuidad operativa","var(--green)")}${kpi("Alarmas críticas","0","sin impacto productivo","var(--green)")}${kpi("Riesgo operativo","A+","60.01 Hz · THD 1.8%","var(--cyan)")}${kpi("Ahorro del día","$"+selected.saving.toLocaleString()+" USD","acumulado en tiempo real","var(--gold)")}</div><div class="grid production-main"><div class="card"><h3>La planta en una mirada</h3><div class="metric-list"><div class="metric"><span>Litros embotellados hoy</span><b>8.42M</b></div><div class="metric"><span>Producción protegida</span><b class="green">$152K USD</b></div><div class="metric"><span>Picos evitados</span><b class="cyan">6</b></div><div class="metric"><span>Operación resiliente</span><b class="green">100%</b></div></div></div><div class="card"><h3>Indicador insignia de productividad</h3><div class="grid kpis-4">${kpi("Litros por kWh",selected.eff.toFixed(1),"clic para abrir centro nacional","var(--cyan)",true)}${kpi("Línea base",(selected.eff/(1+selected.improve/100)).toFixed(1),"antes de Madera Green Tech","var(--gold)")}${kpi("Mejora","+"+selected.improve+"%","productividad energética","var(--green)")}${kpi("Ranking nacional","#"+([...plants].sort((a,b)=>b.eff-a.eff).indexOf(selected)+1),"de 6 pl function chartDefaults(id,n){const dx=rangeLabels(n),weather=id==="solarChart"?solarWeatherPoints(n):null,base={loadChart:{yLabel:"kW",xLabel:"Tiempo",unit:" kW",names:["Carga planta","Red CFE"],labels:dx},solarChart:{yLabel:"kW",xLabel:"Tiempo + clima",unit:" kW",names:["Solar real","Pronóstico"],labels:dx,weather},socChart:{yLabel:"% SOC",xLabel:"Tiempo",unit:"%",names:["SOC batería"],labels:dx},gridChart:{yLabel:"kW CFE",xLabel:"Tiempo",unit:" kW",names:["Dependencia red"],labels:dx},fuelChart:{yLabel:"Litros",xLabel:"Periodo",unit:" L",names:["Combustible"],labels:["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"]},riskChart:{yLabel:"Minutos",xLabel:"Tiempo",unit:" min",names:["Riesgo evitado","Base esperada"],labels:dx},forecastChart:{yLabel:"% precisión",xLabel:"Tiempo",unit:"%",names:["Pronóstico","Real"],labels:dx},eventsChart:{yLabel:"Eventos",xLabel:"Tipo",unit:"",names:["Eventos"],labels:["Info","Atención","Mitigado"]},areaChart:{yLabel:"Litros/kWh",xLabel:"Área productiva",unit:" L/kWh",names:["Productividad"],labels:["Línea 1","Línea 2","Refrig.","Agua","Aux."]},cashChart:{yLabel:"$M acumulado",xLabel:"Horizonte",unit:"M",names:["Real/proyectado","Base esperada","Valor incremental"],labels:Array.from({length:n},(_,i)=>i===0?"Inicio":i===n-1?"Final":"P"+(i+1))},nationalChart:{yLabel:"L/kWh",xLabel:"Sesión",unit:" L/kWh",names:["En vivo","Base","Proyección"],labels:Array.from({length:n},(_,i)=>i===n-1?"Ahora":"T-"+(n-1-i))}};return base[id]||{yLabel:"Valor",xLabel:"Tiempo",unit:"",names:["Serie"],labels:Array.from({length:n},(_,i)=>"P"+(i+1))}}
function attachChartHover(c){if(c._hoverBound)return;c._hoverBound=true;c.addEventListener("mousemove",e=>{const data=c._chartData;if(!data)return;const r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height,mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;let best=null,dist=Infinity;data.points.forEach(p=>{const d=Math.abs(p.x-mx)+(p.y?Math.abs(p.y-my)*.35:0);if(d<dist){dist=d;best=p}});const tip=tooltipFor(c);if(!best||dist>95){tip.style.display="none";return}tip.innerHTML=`<b>${best.label}</b>`+best.items.map(it=>`<span style="color:${it.color}">${it.name}: ${it.value}</span>`).join("")+(best.weather?`<span style="color:#f3d986">Clima: ${best.weather.detail}</span>`:"");tip.style.display="block";tip.style.left=Math.min(r.width-180,Math.max(8,e.clientX-r.left+12))+"px";tip.style.top=Math.max(8,e.clientY-r.top-12)+"px"});c.addEventListener("mouseleave",()=>{const t=tooltipFor(c);t.style.display="none"})}
function line(id,series,colors,opts={}){const c=$("#"+id);if(!c)return;const ctx=c.getContext("2d"),w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2,spec={...chartDefaults(id,series[0]?.length||0),...opts},left=66,right=18,top=18,bottom=id==="solarChart"?66:48,W=w-left-right,H=h-top-bottom,flat=series.flat(),min=Math.min(...flat),max=Math.max(...flat),pad=(max-min||1)*.16,lo=Math.max(0,min-pad),hi=max+pad;ctx.clearRect(0,0,w,h);ctx.font="18px Arial";ctx.textBaseline="middle";ctx.strokeStyle="rgba(255,255,255,.08)";ctx.fillStyle="#73838d";ctx.lineWidth=1;for(let i=0;i<5;i++){const y=top+H*i/4,val=hi-(hi-lo)*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillText(chartFmt(val,spec.unit).replace(spec.unit,""),8,y)}ctx.strokeStyle="rgba(255,255,255,.18)";ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,top+H);ctx.lineTo(w-right,top+H);ctx.stroke();ctx.fillStyle="#73838d";ctx.font="17px Arial";ctx.fillText(spec.yLabel,left,10);ctx.fillText(spec.xLabel,w-right-115,h-12);const labelIndexes=[0,Math.floor((spec.labels.length-1)/2),spec.labels.length-1].filter((v,i,a)=>a.indexOf(v)===i);labelIndexes.forEach(i=>{const x=left+i*W/Math.max(1,spec.labels.length-1);ctx.fillText(spec.labels[i]||"",x-22,h-(id==="solarChart"?40:22))});if(spec.weather){ctx.font="18px Arial";ctx.fillStyle="#f3d986";const step=Math.max(1,Math.ceil(spec.weather.length/6));spec.weather.forEach((wx,i)=>{if(i%step&&i!==spec.weather.length-1)return;const x=left+i*W/Math.max(1,spec.weather.length-1);ctx.fillText(wx.label,x-17,h-20)});ctx.fillStyle="#73838d";ctx.font="15px Arial";ctx.fillText("Clima",left,h-20)}const hoverPoints=[];series.forEach((arr,j)=>{ctx.strokeStyle=colors[j];ctx.lineWidth=4;ctx.beginPath();arr.forEach((v,i)=>{const px=left+i*W/Math.max(1,arr.length-1),py=top+H-(v-lo)/(hi-lo)*H;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();arr.forEach((v,i)=>{const px=left+i*W/Math.max(1,arr.length-1),py=top+H-(v-lo)/(hi-lo)*H;ctx.fillStyle=colors[j];ctx.beginPath();ctx.arc(px,py,3.2,0,Math.PI*2);ctx.fill();if(!hoverPoints[i])hoverPoints[i]={x:px,y:py,label:spec.labels[i]||"P"+(i+1),items:[],weather:spec.weather?.[i]};hoverPoints[i].y=Math.min(hoverPoints[i].y,py);hoverPoints[i].items.push({name:spec.names[j]||"Serie "+(j+1),value:chartFmt(v,spec.unit),color:colors[j]})})});c._chartData={points:hoverPoints};attachChartHover(c)}
